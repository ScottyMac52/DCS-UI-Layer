name: Create tagged OvGME release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        default: minor
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: ovgme-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BUMP: ${{ inputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Required so the workflow can push the regenerated kneeboard commit
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Lua parser
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Install build dependencies
        run: npm ci
      - name: Calculate next version
        id: version
        shell: pwsh
        run: |
          $LatestTag = git tag --list 'v*' --sort=-version:refname |
            Where-Object { $_ -match '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$' } |
            Select-Object -First 1
          $LatestVersion = if ($LatestTag) { $LatestTag.Substring(1) } else { '0.0.0' }
          $Version = node ./scripts/version.mjs next $LatestVersion $env:BUMP
          if ($LASTEXITCODE -ne 0) { throw 'Failed to calculate the next semantic version.' }
          $Tag = "v$Version"
          if (git tag --list -- $Tag) { throw "Tag $Tag already exists." }
          "PACKAGE_VERSION=$Version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$Tag" >> $env:GITHUB_ENV
          "RELEASE_SHA=$(git rev-parse HEAD)" >> $env:GITHUB_ENV
          "tag=$Tag" >> $env:GITHUB_OUTPUT
      - name: Parse and validate sources
        shell: pwsh
        run: |
          Get-ChildItem src -Recurse -Filter '*.lua' | ForEach-Object {
            & luac5.4 -p $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Invalid Lua: $($_.FullName)" }
          }
          ./scripts/Test-Profile.ps1
          ./scripts/Test-CollisionFixtures.ps1
      - name: Build and validate release
        shell: pwsh
        run: |
          npm run build:kneeboard
          npm test
          ./scripts/Build-OvGME.ps1 -Version $env:PACKAGE_VERSION
          ./scripts/Test-Package.ps1 -Version $env:PACKAGE_VERSION
          ./scripts/Build-Release.ps1 -Version $env:PACKAGE_VERSION
          ./scripts/Test-Release.ps1 -Version $env:PACKAGE_VERSION
          $Notes = Get-Content packaging/release/RELEASE-NOTES.md -Raw
          New-Item .build -ItemType Directory -Force | Out-Null
          $Notes.Replace('{{VERSION}}', $env:PACKAGE_VERSION) | Set-Content .build/RELEASE-NOTES.md
      - name: Commit regenerated kneeboard pages
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kneeboard/source kneeboard/UiLayer

          $status = git status --porcelain kneeboard/source kneeboard/UiLayer
          if ([string]::IsNullOrWhiteSpace($status)) {
            Write-Host "Kneeboard pages are already up to date; nothing to commit."
            return
          }

          # [skip ci] prevents the push from triggering build.yml
          git commit -m "chore: regenerate kneeboard pages for $env:RELEASE_TAG [skip ci]"
          git push origin HEAD:main

          $NewSha = git rev-parse HEAD
          "RELEASE_SHA=$NewSha" >> $env:GITHUB_ENV
          Write-Host "Pushed regenerated kneeboard pages as $NewSha"
      - uses: actions/upload-artifact@v4
        with:
          name: DCS-UI-Layer-Release-${{ steps.version.outputs.tag }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Create tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Assets = Get-ChildItem dist/*.zip, dist/SHA256SUMS.txt | ForEach-Object FullName
          gh release create $env:RELEASE_TAG $Assets `
            --target $env:RELEASE_SHA `
            --title "DCS UI Layer $env:PACKAGE_VERSION" `
            --notes-file .build/RELEASE-NOTES.md `
            --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Failed to create release $env:RELEASE_TAG." }

