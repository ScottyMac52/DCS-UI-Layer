name: Create tagged OvGME release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        default: minor
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: ovgme-release
  cancel-in-progress: false

jobs:
  release:
    uses: ScottyMac52/DCS-Common/.github/workflows/release.yml@main
    with:
      bump: ${{ inputs.bump }}
      install-lua-parser: true
      run-lua-parse: true
      extra-validation-command: |
        npm run test:profile
        ./scripts/Test-Profile.ps1
        ./scripts/Test-CollisionFixtures.ps1
      package-script: scripts/Build-OvGME.ps1
      test-package-script: scripts/Test-Package.ps1
      build-release-script: scripts/Build-Release.ps1
      test-release-script: scripts/Test-Release.ps1
      run-release-validation: true
      artifact-name: DCS-UI-Layer-Release-${{ inputs.bump }}-${{ github.run_number }}
      artifact-path: |
        dist/*.zip
        dist/SHA256SUMS.txt
      release-notes-path: .build/RELEASE-NOTES.md
      prepare-release-notes-command: |
        $Notes = Get-Content packaging/release/RELEASE-NOTES.md -Raw
        New-Item .build -ItemType Directory -Force | Out-Null
        $Notes.Replace('{{VERSION}}', $env:PACKAGE_VERSION) | Set-Content .build/RELEASE-NOTES.md
      kneeboard-paths: kneeboard/source kneeboard/global
      release-title-prefix: DCS UI Layer
    secrets: inherit
