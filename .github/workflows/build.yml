name: Build OvGME package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Lua parser
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Install build dependencies
        run: npm ci
      - name: Parse Lua profiles
        shell: pwsh
        run: |
          Get-ChildItem src -Recurse -Filter '*.lua' | ForEach-Object {
            & luac5.4 -p $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Invalid Lua: $($_.FullName)" }
          }
      - name: Generate and validate OpenKneeboard
        run: npm run build:kneeboard && npm test
      - name: Validate profile and collision fixtures
        shell: pwsh
        run: |
          ./scripts/Test-Profile.ps1
          ./scripts/Test-CollisionFixtures.ps1
      - name: Build and validate packages
        shell: pwsh
        run: |
          ./scripts/Build-OvGME.ps1 -Version $env:PACKAGE_VERSION
          ./scripts/Test-Package.ps1 -Version $env:PACKAGE_VERSION
          ./scripts/Build-Release.ps1 -Version $env:PACKAGE_VERSION
          ./scripts/Test-Release.ps1 -Version $env:PACKAGE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: DCS-UI-Layer-Release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

